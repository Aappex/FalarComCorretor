<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Imobi — Falar com Corretor</title>
<meta name="description" content="Fale agora com o corretor da vez da Apex Imobi pelo WhatsApp.">
<style>
  :root {
    --bg: #e9eff1;
    --ink: #0e2a35;
    --muted: #4a6370;
    --btn: #25d366;
    --btn-hover: #1fbd5b;
    --btn-ink: #052e16;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 14px; display: block; }
  h1 {
    margin: 0 0 40px;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 11vw, 3.6rem);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 20px 24px;
    background: var(--btn);
    color: var(--btn-ink);
    border-radius: 999px;
    font-size: 1.2rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 10px 24px -10px rgba(18, 140, 74, .65);
    transition: background-color .15s, transform .15s, box-shadow .15s;
  }
  .cta:hover { background: var(--btn-hover); }
  .cta:active { transform: scale(.98); }
  .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .cta svg { width: 28px; height: 28px; flex: none; }
  .cta[aria-disabled="true"] {
    pointer-events: none;
    opacity: .65;
    box-shadow: none;
  }
  .hint { margin: 18px 0 0; font-size: .98rem; color: var(--muted); line-height: 1.45; }
  @media (prefers-reduced-motion: reduce) { .cta { transition: none; } }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 56 56" fill="none" stroke="#0e2a35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M8 44 28 12l20 32"/>
    <path d="M19 44l9-14 9 14"/>
  </svg>
  <h1>Apex Imobi</h1>

  <!-- Contingência: sem JavaScript, o botão já abre o WhatsApp do 1º corretor (Tenilson). -->
  <a id="btn" class="cta"
     href="https://api.whatsapp.com/send?phone=558481676913&text=Ol%C3%A1%20Tenilson%2C%20gostaria%20de%20atendimento%20sobre%20os%20im%C3%B3veis%20que%20vi%20no%20Instagram%20da%20Apex_imobi.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      <g transform="translate(6.6 6.4) scale(.45)" stroke-width="3.2">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </g>
    </svg>
    <span id="btn-label">Falar com Corretor</span>
  </a>
  <p class="hint">Você será direcionado ao WhatsApp do corretor da vez.</p>
</main>

<script>
/* ============================================================
   CONFIGURAÇÃO — edite apenas esta seção
   ============================================================ */

// Fila de corretores, na ordem exata do rodízio
const CORRETORES = [
  { nome: "Tenilson", telefone: "558481676913"  },
  { nome: "Glauco",   telefone: "558487766351"  },
  { nome: "Jean",     telefone: "5584921820658" },
];

// {NOME} é trocado automaticamente pelo nome do corretor da vez
const MENSAGEM_PADRAO =
  "Olá {NOME}, gostaria de atendimento sobre os imóveis que vi no Instagram da Apex_imobi.";

// CounterAPI v2
const API_BASE     = "https://api.counterapi.dev";   // host oficial da API v2
const WORKSPACE    = "apex_imobi_2026_oficial";
const COUNTER_NAME = "fila_plantao";

// Outros ajustes
const TIMEOUT_MS   = 700;                             // limite de espera pela API
const WHATSAPP_URL = "https://api.whatsapp.com/send"; // usa ?phone= e &text=
const CHAVE_LOCAL  = "apex_fila_local";               // chave do localStorage (contingência)

/* ============================================================
   CÓDIGO — não precisa mexer daqui para baixo
   ============================================================ */

const btn   = document.getElementById("btn");
const label = document.getElementById("btn-label");
const TEXTO_ORIGINAL = label.textContent;
let ocupado = false;

function montarLink(corretor) {
  const texto = MENSAGEM_PADRAO.split("{NOME}").join(corretor.nome);
  return WHATSAPP_URL + "?phone=" + corretor.telefone + "&text=" + encodeURIComponent(texto);
}

// Contagem global via CounterAPI v2: POST em /up, com limite de tempo
async function contagemViaAPI() {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const url = API_BASE + "/v2/" + encodeURIComponent(WORKSPACE) + "/" +
                encodeURIComponent(COUNTER_NAME) + "/up";
    const opcoes = { method: "POST", signal: ctrl.signal, cache: "no-store" };
    let res = await fetch(url, opcoes);
    // A documentação mostra o /up via GET; se o POST for recusado (405), tenta GET
    if (res.status === 405) res = await fetch(url, { ...opcoes, method: "GET" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    const n = Number(json && json.data ? json.data.up_count : json.up_count);
    if (!Number.isFinite(n) || n < 1) throw new Error("Resposta inválida");
    return n;
  } finally {
    clearTimeout(timer);
  }
}

// Contingência: a fila continua girando neste aparelho
let contadorMemoria = 0;
function contagemLocal() {
  try {
    const n = (parseInt(localStorage.getItem(CHAVE_LOCAL), 10) || 0) + 1;
    localStorage.setItem(CHAVE_LOCAL, String(n));
    return n;
  } catch (e) {
    // localStorage bloqueado (ex.: navegação privada): usa memória + relógio
    contadorMemoria += 1;
    return Math.floor(Date.now() / 1000) + contadorMemoria;
  }
}

function travar(travado) {
  ocupado = travado;
  btn.setAttribute("aria-disabled", travado ? "true" : "false");
  label.textContent = travado ? "Conectando…" : TEXTO_ORIGINAL;
}

btn.addEventListener("click", async function (evento) {
  evento.preventDefault();
  if (ocupado) return;
  travar(true);

  let destino = btn.href; // se algo der errado, mantém o link estático (Tenilson)
  try {
    let n;
    try {
      n = await contagemViaAPI();
    } catch (erro) {
      n = contagemLocal(); // timeout ou erro de rede → contingência imediata
    }
    const posicao = (((n - 1) % CORRETORES.length) + CORRETORES.length) % CORRETORES.length;
    destino = montarLink(CORRETORES[posicao]);
  } catch (erro) {
    /* mantém o destino estático */
  }
  window.location.href = destino;
});

// Se o cliente voltar pelo botão "Voltar" do navegador, libera o botão de novo
window.addEventListener("pageshow", function () { travar(false); });
</script>
</body>
</html>
